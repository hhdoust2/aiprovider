<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مدیریت و تست API Keyها و ارائه‌دهنده‌ها</title>
    
    <!-- PWA Meta Tags & Manifest -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#faf8f6">
    <link rel="apple-touch-icon" href="icon-192.png">

    <!-- Fonts & Bootstrap 5 RTL -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/vazirmatn/400.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/vazirmatn/500.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/vazirmatn/700.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/jetbrains-mono/500.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

    <style>
        :root {
            --primary: #F55036;
            --primary-hover: #e0432b;
            --bg: #faf8f6;
            --card-bg: #ffffff;
            --border: #eee4de;
            --text-main: #1f2328;
            --text-muted: #71767d;
            --radius-lg: 16px;
            --radius-md: 10px;
            --shadow: 0 10px 30px rgba(31,35,40,.06);
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Vazirmatn', system-ui, sans-serif;
            background: radial-gradient(1000px 500px at 50% -100px, #ffe8e0, transparent), var(--bg);
            color: var(--text-main);
            min-height: 100vh;
            padding-bottom: 50px;
        }

        /* Header Navbar */
        .navbar {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            box-shadow: 0 4px 20px rgba(0,0,0,0.02);
        }

        .navbar-brand {
            color: var(--text-main) !important;
            font-weight: 700;
        }

        /* Navigation Tabs */
        .nav-pills {
            background: #f1e9e3;
            padding: 4px;
            border-radius: 999px;
            display: inline-flex;
        }

        .nav-pills .nav-link {
            color: var(--text-muted);
            font-weight: 600;
            border-radius: 999px;
            padding: 8px 20px;
            transition: all 0.2s ease;
            font-size: 14px;
        }

        .nav-pills .nav-link.active {
            background-color: var(--card-bg);
            color: var(--primary);
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        /* Card Styles */
        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow);
            margin-bottom: 24px;
            overflow: hidden;
        }

        .card-header {
            background-color: #fdfaf8;
            border-bottom: 1px solid var(--border);
            color: var(--text-main);
            font-weight: 700;
            padding: 16px 20px;
        }

        /* Custom Item Cards */
        .item-card {
            background: #ffffff;
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 16px;
            margin-bottom: 14px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .item-card:hover {
            box-shadow: 0 6px 18px rgba(0,0,0,0.04);
        }

        /* Badges & Buttons */
        .badge-model {
            background-color: #fcf8f6;
            color: var(--primary);
            border: 1px solid #fcdcd5;
            font-size: 0.8rem;
            padding: 6px 12px;
            border-radius: 8px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin: 3px;
            cursor: pointer;
            transition: all 0.2s;
            font-family: 'JetBrains Mono', monospace;
            direction: ltr;
        }
        
        .badge-model:hover {
            background-color: var(--primary);
            color: #ffffff;
            border-color: var(--primary);
        }

        .btn-primary {
            background: linear-gradient(135deg, #FF7A45, var(--primary));
            border: none;
            box-shadow: 0 4px 12px rgba(245, 80, 54, 0.2);
            font-weight: 600;
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, var(--primary), var(--primary-hover));
            box-shadow: 0 6px 15px rgba(245, 80, 54, 0.3);
        }

        .url-text {
            color: var(--text-muted);
            font-size: 0.85rem;
            font-family: 'JetBrains Mono', monospace;
            word-break: break-all;
        }

        .key-box {
            font-family: 'JetBrains Mono', monospace;
            direction: ltr;
            text-align: left;
            background: #fcf8f6;
            padding: 8px 12px;
            border-radius: var(--radius-md);
            border: 1px solid var(--border);
            word-break: break-all;
            font-size: 0.88rem;
            color: var(--text-main);
            flex-grow: 1;
        }

        /* Inputs & Controls */
        .form-control, .form-select, textarea {
            background-color: #ffffff;
            border-color: var(--border);
            color: var(--text-main);
            border-radius: var(--radius-md);
            font-size: 13.5px;
        }

        .form-control:focus, .form-select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(245, 80, 54, 0.12);
        }

        input[type="text"].code-font, textarea.code-font, .font-mono {
            font-family: 'JetBrains Mono', monospace;
            direction: ltr;
        }

        .checkbox-group { 
            display: flex; 
            align-items: center; 
            gap: 10px; 
            font-size: 13px; 
            color: var(--text-main); 
            margin-bottom: 12px; 
            background: #fdfaf8;
            padding: 10px 14px;
            border-radius: var(--radius-md);
            border: 1px dashed var(--border);
        }

        .checkbox-group label { margin-bottom: 0; font-weight: 500; cursor: pointer; }
        .checkbox-group input[type="checkbox"] { 
            width: 16px; 
            height: 16px; 
            accent-color: var(--primary);
            cursor: pointer;
        }

        /* Modals */
        .modal-content { background-color: #ffffff; border: 1px solid var(--border); border-radius: var(--radius-lg); color: var(--text-main); }
        .modal-header { border-bottom: 1px solid var(--border); background-color: #fdfaf8; }
        .modal-footer { border-top: 1px solid var(--border); }

        /* Health Test Table Styles */
        .table-responsive {
            width: 100%;
            overflow-x: auto;
            margin-top: 20px;
            border-radius: var(--radius-md);
            border: 1px solid var(--border);
        }

        #resultsTable { 
            width: 100%; 
            border-collapse: collapse; 
            font-size: 13px; 
            background: #fff;
            margin: 0;
        }

        #resultsTable th, #resultsTable td { 
            padding: 12px 14px; 
            text-align: center; 
            border-bottom: 1px solid var(--border);
            vertical-align: middle;
        }

        #resultsTable th { 
            background-color: #fcf8f6; 
            color: var(--text-muted); 
            font-weight: 700;
            font-size: 12px;
        }

        #resultsTable tr:last-child td { border-bottom: none; }

        .status-success { color: #15803d; background-color: #ecf7ee; font-weight: 700; border-radius: 20px; padding: 4px 10px; display: inline-block; font-size: 12px; }
        .status-error { color: #b91c1c; background-color: #fef2f2; font-weight: 700; border-radius: 20px; padding: 4px 10px; display: inline-block; font-size: 12px; }
        .status-pending { color: #b45309; background-color: #fff8ec; border-radius: 20px; padding: 4px 10px; display: inline-block; font-size: 12px; }
        
        .copy-btn { 
            background: #ffffff; 
            color: var(--text-muted); 
            border: 1px solid var(--border); 
            padding: 2px 6px; 
            border-radius: 6px; 
            cursor: pointer; 
            font-size: 11px; 
            transition: all 0.2s;
        }
        .copy-btn:hover { border-color: var(--primary); color: var(--primary); }
        .model-cell { display: flex; align-items: center; justify-content: space-between; direction: ltr; font-weight: 700; font-family: 'JetBrains Mono', monospace; }
        
        .badge-mode { padding: 3px 8px; border-radius: 6px; font-size: 11px; font-weight: 700; font-family: 'JetBrains Mono', monospace; }
        .mode-direct { background: #f1f5f9; color: #475569; }
        .mode-proxy { background: #fef3c7; color: #92400e; }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg sticky-top mb-4">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2 mb-2 mb-lg-0" href="#">
                <i class="fa-solid fa-bolt text-danger fs-4"></i>
                <span>مدیریت API Key و سرویس‌ها</span>
            </a>

            <!-- Tab Buttons Header -->
            <ul class="nav nav-pills my-2 my-lg-0" id="mainTabs" role="tablist">
                <li class="nav-item" role="presentation">
                    <button class="nav-link active" id="tab-manager-btn" data-bs-toggle="pill" data-bs-target="#tab-manager" type="button" role="tab">
                        <i class="fa-solid fa-list-check me-1"></i> مدیریت سرویس‌ها
                    </button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" id="tab-tester-btn" data-bs-toggle="pill" data-bs-target="#tab-tester" type="button" role="tab">
                        <i class="fa-solid fa-heart-pulse me-1"></i> تست سلامت API
                    </button>
                </li>
            </ul>

            <div class="d-flex flex-wrap gap-2">
                <button class="btn btn-outline-success btn-sm d-flex align-items-center gap-1" onclick="exportJSON()">
                    <i class="fa-solid fa-download"></i> خروجی JSON
                </button>
                <label class="btn btn-outline-primary btn-sm d-flex align-items-center gap-1 m-0" style="cursor: pointer;">
                    <i class="fa-solid fa-upload"></i> ورود JSON
                    <input type="file" id="importFileInput" accept=".json" style="display: none;" onchange="importJSON(event)">
                </label>
                <button class="btn btn-outline-danger btn-sm" onclick="resetToDefault()" title="بازنشانی">
                    <i class="fa-solid fa-rotate-left"></i>
                </button>
            </div>
        </div>
    </nav>

    <div class="container">
        <!-- Toast Notification Container -->
        <div id="toastContainer" class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index: 1100;"></div>

        <div class="tab-content" id="mainTabsContent">
            
            <!-- TAB 1: API Manager (ORIGINAL) -->
            <div class="tab-pane fade show active" id="tab-manager" role="tabpanel">
                <!-- Section 1: API Keys -->
                <div class="card">
                    <div class="card-header d-flex justify-content-between align-items-center flex-wrap gap-2">
                        <span><i class="fa-solid fa-shield-halved me-2 text-primary"></i> کلیدهای API (API Keys)</span>
                        <button class="btn btn-primary btn-sm" onclick="openAddKeyModal()">
                            <i class="fa-solid fa-plus me-1"></i> افزودن کلید جدید
                        </button>
                    </div>
                    <div class="card-body p-3" id="apiKeysContainer">
                        <!-- Content inserted via JS -->
                    </div>
                </div>

                <!-- Section 2: Providers & Models -->
                <div class="card">
                    <div class="card-header d-flex justify-content-between align-items-center flex-wrap gap-2">
                        <span><i class="fa-solid fa-server me-2 text-primary"></i> تنظیمات سرویس‌ها و مدل‌ها</span>
                        <button class="btn btn-primary btn-sm" onclick="openAddProviderModal()">
                            <i class="fa-solid fa-plus me-1"></i> افزودن سرویس جدید
                        </button>
                    </div>
                    <div class="card-body p-3" id="providersContainer">
                        <!-- Content inserted via JS -->
                    </div>
                </div>
            </div>

            <!-- TAB 2: API Health Tester -->
            <div class="tab-pane fade" id="tab-tester" role="tabpanel">
                <div class="card">
                    <div class="card-header">
                        <i class="fa-solid fa-vial me-2 text-danger"></i> تست چندمدلی سلامت API
                    </div>
                    <div class="card-body p-4">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold">انتخاب یا فراخوانی سرویس:</label>
                                <select id="testerProviderSelect" class="form-select" onchange="onTesterProviderChange()">
                                    <!-- Populated dynamically from saved providers -->
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold">کلید API (جهت تست):</label>
                                <select id="testerKeySelect" class="form-select" onchange="onTesterKeyChange()">
                                    <!-- Populated dynamically from saved keys -->
                                </select>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">آدرس Endpoint یا Base URL:</label>
                            <input type="text" id="baseUrl" class="form-control code-font" placeholder="https://...">
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">کلید اختصاصی (API Key):</label>
                            <div class="input-group">
                                <input type="password" id="apiKey" class="form-control code-font" placeholder="sk-...">
                                <button class="btn btn-outline-secondary" type="button" onclick="togglePasswordVisibility()">
                                    <i class="fa-solid fa-eye" id="testerEyeIcon"></i>
                                </button>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">نام مدل‌ها (با کاما یا خط جدید جدا کنید):</label>
                            <textarea id="modelNames" class="form-control code-font" rows="3" placeholder="gpt-4o, llama-3.3-70b-versatile"></textarea>
                        </div>

                        <div class="row mb-3">
                            <div class="col-md-6">
                                <div class="checkbox-group">
                                    <input type="checkbox" id="streamMode">
                                    <label for="streamMode">حالت استریم (stream: true)</label>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="checkbox-group">
                                    <input type="checkbox" id="enableReasoning">
                                    <label for="enableReasoning">پشتیبانی از Reasoning</label>
                                </div>
                            </div>
                        </div>

                        <button class="btn btn-primary w-100 py-2 fw-bold text-white fs-6" id="startBtn" onclick="testBatchModels()">
                            <i class="fa-solid fa-play me-2"></i> شروع تست گروهی مدل‌ها
                        </button>

                        <div class="table-responsive">
                            <table id="resultsTable" style="display: none;">
                                <thead>
                                    <tr>
                                        <th>نام مدل</th>
                                        <th>وضعیت</th>
                                        <th>اتصال</th>
                                        <th>مصرف توکن</th>
                                        <th>تاخیر (ms)</th>
                                        <th>پاسخ / خطا</th>
                                    </tr>
                                </thead>
                                <tbody id="resultsBody"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- Modals -->
    <div class="modal fade" id="keyModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="keyModalTitle">افزودن کلید جدید</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="keyForm">
                        <input type="hidden" id="keyIndex">
                        <div class="mb-3">
                            <label class="form-label">برچسب (Label)</label>
                            <input type="text" class="form-control" id="keyLabel" placeholder="مثال: groq1" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">کلید API (Key)</label>
                            <input type="text" class="form-control code-font" id="keyValue" placeholder="gsk_..." required>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">انصراف</button>
                    <button type="button" class="btn btn-primary btn-sm" onclick="saveKey()">ذخیره</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="providerModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="providerModalTitle">افزودن/ویرایش سرویس</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="providerForm">
                        <input type="hidden" id="providerOriginalPath">
                        <div class="mb-3">
                            <label class="form-label">نام سرویس (Name)</label>
                            <input type="text" class="form-control" id="providerName" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">آدرس Endpoint (URL)</label>
                            <input type="url" class="form-control code-font" id="providerUrl" placeholder="https://..." required dir="ltr">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">مدل‌ها (هر مدل در یک خط)</label>
                            <textarea class="form-control code-font" id="providerModels" rows="5" dir="ltr"></textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">انصراف</button>
                    <button type="button" class="btn btn-primary btn-sm" onclick="saveProvider()">ذخیره</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const defaultData = {
          "version": "1.0",
          "export_date": new Date().toISOString(),
          "api_keys": []
        };

        let appData = {};
        let keyModal, providerModal;

        document.addEventListener("DOMContentLoaded", () => {
            keyModal = new bootstrap.Modal(document.getElementById('keyModal'));
            providerModal = new bootstrap.Modal(document.getElementById('providerModal'));
            loadData();
            renderUI();
            populateTesterDropdowns();
        });

        function loadData() {
            const saved = localStorage.getItem('api_manager_data');
            if (saved) {
                try { appData = JSON.parse(saved); } 
                catch(e) { appData = JSON.parse(JSON.stringify(defaultData)); }
            } else {
                appData = JSON.parse(JSON.stringify(defaultData));
                saveToLocalStorage();
            }
        }

        function saveToLocalStorage() {
            localStorage.setItem('api_manager_data', JSON.stringify(appData, null, 2));
        }

        function renderUI() {
            renderKeys();
            renderProviders();
            populateTesterDropdowns();
        }

        function renderKeys() {
            const container = document.getElementById('apiKeysContainer');
            container.innerHTML = '';
            if (!appData.api_keys || appData.api_keys.length === 0) {
                container.innerHTML = `<p class="text-muted text-center py-3 m-0">هیچ کلیدی یافت نشد.</p>`;
                return;
            }

            appData.api_keys.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'item-card';
                card.innerHTML = `
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <span class="badge bg-secondary text-light fs-6 fw-normal">${escapeHtml(item.label)}</span>
                        <div>
                            <button class="btn btn-sm btn-outline-warning py-1 px-2 me-1" onclick="openEditKeyModal(${index})"><i class="fa-solid fa-pen-to-square"></i></button>
                            <button class="btn btn-sm btn-outline-danger py-1 px-2" onclick="deleteKey(${index})"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    </div>
                    <div class="d-flex align-items-center gap-2">
                        <div class="key-box" id="key-val-${index}">${maskKey(item.key)}</div>
                        <button class="btn btn-outline-secondary py-1 px-2" onclick="toggleKeyVisibility(${index}, '${escapeHtml(item.key)}')">
                            <i class="fa-solid fa-eye" id="eye-icon-${index}"></i>
                        </button>
                        <button class="btn btn-primary py-1 px-2 text-white" onclick="copyToClipboard('${escapeHtml(item.key)}', 'کلید API کپی شد.')" title="کپی کلید">
                            <i class="fa-solid fa-copy"></i>
                        </button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function maskKey(key) {
            if (!key) return '';
            if (key.length <= 12) return '••••••••••••';
            return key.substring(0, 6) + '••••' + key.substring(key.length - 4);
        }

        function toggleKeyVisibility(index, fullKey) {
            const el = document.getElementById(`key-val-${index}`);
            const icon = document.getElementById(`eye-icon-${index}`);
            if (el.getAttribute('data-shown') === 'true') {
                el.textContent = maskKey(fullKey);
                el.setAttribute('data-shown', 'false');
                icon.className = 'fa-solid fa-eye';
            } else {
                el.textContent = fullKey;
                el.setAttribute('data-shown', 'true');
                icon.className = 'fa-solid fa-eye-slash';
            }
        }

        function renderProviders() {
            const container = document.getElementById('providersContainer');
            container.innerHTML = '';
            const providers = extractProviders(appData);

            if (providers.length === 0) {
                container.innerHTML = `<p class="text-muted text-center py-3 m-0">هیچ سرویسی تنظیم نشده است.</p>`;
                return;
            }

            providers.forEach((prov) => {
                const card = document.createElement('div');
                card.className = 'item-card';

                let modelsBadges = (prov.models || []).map(m => `
                    <span class="badge-model" onclick="copyToClipboard('${escapeHtml(m)}', 'نام مدل کپی شد.')" title="برای کپی کلیک کنید">
                        <i class="fa-solid fa-robot"></i> ${escapeHtml(m)}
                        <i class="fa-solid fa-copy ms-1 text-muted" style="font-size:0.7rem;"></i>
                    </span>
                `).join('');

                const joinedModels = (prov.models || []).join(', ');

                card.innerHTML = `
                    <div class="d-flex justify-content-between align-items-start flex-wrap gap-2 mb-2">
                        <div style="max-width: 100%;">
                            <h5 class="m-0 text-primary fw-bold">${escapeHtml(prov.name)}</h5>
                            <div class="d-flex align-items-center gap-2 mt-2 flex-wrap">
                                <span class="url-text" dir="ltr"><i class="fa-solid fa-link me-1"></i>${escapeHtml(prov.url)}</span>
                                <button class="btn btn-sm btn-outline-secondary py-0 px-2" style="font-size:0.75rem;" onclick="copyToClipboard('${escapeHtml(prov.url)}', 'آدرس URL کپی شد.')">
                                    <i class="fa-solid fa-copy me-1"></i> کپی URL
                                </button>
                            </div>
                        </div>
                        <div class="d-flex gap-1 ms-auto">
                            <button class="btn btn-sm btn-outline-warning py-1 px-2" onclick="openEditProviderModal('${prov.path.join('.')}')"><i class="fa-solid fa-pen-to-square"></i></button>
                            <button class="btn btn-sm btn-outline-danger py-1 px-2" onclick="deleteProvider('${prov.path.join('.')}')"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    </div>
                    <hr class="my-2" style="border-color: var(--border);">
                    <div>
                        <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-2">
                            <strong class="text-secondary" style="font-size: 0.85rem;">مدل‌های فعال:</strong>
                            ${prov.models && prov.models.length > 0 ? `
                                <button class="btn btn-sm btn-outline-primary py-0 px-2" style="font-size:0.75rem;" onclick="copyToClipboard('${escapeHtml(joinedModels)}', 'تمام مدل‌ها با علامت , کپی شدند.')">
                                    <i class="fa-solid fa-copy me-1"></i> کپی همگی با ,
                                </button>
                            ` : ''}
                        </div>
                        <div class="d-flex flex-wrap">${modelsBadges || '<span class="text-muted small">بدون مدل</span>'}</div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function extractProviders(obj, path = []) {
            let list = [];
            for (let key in obj) {
                if (key === 'version' || key === 'export_date' || key === 'api_keys') continue;
                const val = obj[key];
                if (val && typeof val === 'object' && val.url && val.models) {
                    list.push({ path: [...path, key], name: val.name || key, url: val.url, models: val.models });
                } else if (val && typeof val === 'object' && !Array.isArray(val)) {
                    list = list.concat(extractProviders(val, [...path, key]));
                }
            }
            return list;
        }

        function getNestedObject(obj, pathArray) {
            return pathArray.reduce((prev, curr) => (prev && prev[curr] !== undefined) ? prev[curr] : null, obj);
        }

        function openAddKeyModal() {
            document.getElementById('keyModalTitle').textContent = 'افزودن کلید جدید';
            document.getElementById('keyIndex').value = '-1';
            document.getElementById('keyLabel').value = '';
            document.getElementById('keyValue').value = '';
            keyModal.show();
        }

        function openEditKeyModal(index) {
            const item = appData.api_keys[index];
            document.getElementById('keyModalTitle').textContent = 'ویرایش کلید';
            document.getElementById('keyIndex').value = index;
            document.getElementById('keyLabel').value = item.label;
            document.getElementById('keyValue').value = item.key;
            keyModal.show();
        }

        function saveKey() {
            const index = parseInt(document.getElementById('keyIndex').value);
            const label = document.getElementById('keyLabel').value.trim();
            const key = document.getElementById('keyValue').value.trim();

            if (!label || !key) return showToast('لطفاً همه فیلدها را پر کنید.', 'danger');

            if (!appData.api_keys) appData.api_keys = [];

            if (index === -1) {
                appData.api_keys.push({ label, key });
                showToast('کلید جدید اضافه شد.', 'success');
            } else {
                appData.api_keys[index] = { label, key };
                showToast('کلید به‌روزرسانی شد.', 'success');
            }

            saveToLocalStorage();
            renderUI();
            keyModal.hide();
        }

        function deleteKey(index) {
            if (confirm('آیا از حذف این کلید اطمینان دارید؟')) {
                appData.api_keys.splice(index, 1);
                saveToLocalStorage();
                renderUI();
                showToast('کلید حذف شد.', 'info');
            }
        }

        function openAddProviderModal() {
            document.getElementById('providerModalTitle').textContent = 'افزودن سرویس جدید';
            document.getElementById('providerOriginalPath').value = '';
            document.getElementById('providerName').value = '';
            document.getElementById('providerUrl').value = '';
            document.getElementById('providerModels').value = '';
            providerModal.show();
        }

        function openEditProviderModal(pathStr) {
            const path = pathStr.split('.');
            const target = getNestedObject(appData, path);
            if (!target) return;

            document.getElementById('providerModalTitle').textContent = 'ویرایش سرویس';
            document.getElementById('providerOriginalPath').value = pathStr;
            document.getElementById('providerName').value = target.name || path[path.length - 1];
            document.getElementById('providerUrl').value = target.url || '';
            document.getElementById('providerModels').value = (target.models || []).join('\n');
            providerModal.show();
        }

        function saveProvider() {
            const pathStr = document.getElementById('providerOriginalPath').value;
            const name = document.getElementById('providerName').value.trim();
            const url = document.getElementById('providerUrl').value.trim();
            const modelsText = document.getElementById('providerModels').value;
            const models = modelsText.split('\n').map(m => m.trim()).filter(m => m.length > 0);

            if (!name || !url) return showToast('نام و آدرس URL الزامی است.', 'danger');

            const providerObj = { name, url, models };

            if (pathStr) {
                const path = pathStr.split('.');
                let current = appData;
                for (let i = 0; i < path.length - 1; i++) { current = current[path[i]]; }
                current[path[path.length - 1]] = providerObj;
                showToast('سرویس با موفقیت ویرایش شد.', 'success');
            } else {
                const rootKey = name.toLowerCase().replace(/[^a-z0-9_]/g, '_');
                appData[rootKey] = providerObj;
                showToast('سرویس جدید اضافه شد.', 'success');
            }

            saveToLocalStorage();
            renderUI();
            providerModal.hide();
        }

        function deleteProvider(pathStr) {
            if (confirm('آیا از حذف این سرویس اطمینان دارید؟')) {
                const path = pathStr.split('.');
                let current = appData;
                for (let i = 0; i < path.length - 1; i++) { current = current[path[i]]; }
                delete current[path[path.length - 1]];

                saveToLocalStorage();
                renderUI();
                showToast('سرویس حذف شد.', 'info');
            }
        }

        function exportJSON() {
            appData.export_date = new Date().toISOString();
            saveToLocalStorage();

            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(appData, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `api_backup_${new Date().toISOString().slice(0,10)}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();

            showToast('فایل JSON با موفقیت دانلود شد.', 'success');
        }

        function importJSON(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const parsed = JSON.parse(e.target.result);
                    if (typeof parsed === 'object' && parsed !== null) {
                        appData = parsed;
                        saveToLocalStorage();
                        renderUI();
                        showToast('اطلاعات با موفقیت از فایل JSON وارد شد.', 'success');
                    } else {
                        showToast('فرمت فایل انتخاب شده معتبر نیست.', 'danger');
                    }
                } catch (err) {
                    showToast('خطا در خواندن فایل JSON!', 'danger');
                }
            };
            reader.readAsText(file);
            event.target.value = '';
        }

        function resetToDefault() {
            if (confirm('آیا می‌خواهید تمامی داده‌ها به حالت پیش‌فرض اولیه بازگردند؟')) {
                appData = JSON.parse(JSON.stringify(defaultData));
                saveToLocalStorage();
                renderUI();
                showToast('داده‌ها به حالت اولیه بازگشتند.', 'warning');
            }
        }

        function copyToClipboard(text, successMsg = 'در حافظه کپی شد.') {
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(text).then(() => {
                    showToast(successMsg, 'info');
                }).catch(() => {
                    fallbackCopyTextToClipboard(text, successMsg);
                });
            } else {
                fallbackCopyTextToClipboard(text, successMsg);
            }
        }

        function fallbackCopyTextToClipboard(text, successMsg) {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.top = "0";
            textArea.style.left = "0";
            textArea.style.position = "fixed";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            try {
                document.execCommand('copy');
                showToast(successMsg, 'info');
            } catch (err) {
                showToast('خطا در کپی کردن متن!', 'danger');
            }
            document.body.removeChild(textArea);
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toastEl = document.createElement('div');
            toastEl.className = `toast align-items-center text-bg-${type} border-0 show`;
            toastEl.setAttribute('role', 'alert');
            toastEl.innerHTML = `
                <div class="d-flex">
                    <div class="toast-body">${message}</div>
                    <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
                </div>
            `;
            container.appendChild(toastEl);
            setTimeout(() => { toastEl.remove(); }, 3000);
        }

        /* --- TAB 2: TESTER LOGIC --- */

        function populateTesterDropdowns() {
            const providerSelect = document.getElementById('testerProviderSelect');
            const keySelect = document.getElementById('testerKeySelect');

            providerSelect.innerHTML = '<option value="">-- انتخاب دستی / انتخابی از لیست --</option>';
            const providers = extractProviders(appData);
            providers.forEach(p => {
                const opt = document.createElement('option');
                opt.value = p.path.join('.');
                opt.textContent = p.name;
                providerSelect.appendChild(opt);
            });

            keySelect.innerHTML = '<option value="">-- انتخاب دستی / بدون کلید پیش‌فرض --</option>';
            if (appData.api_keys) {
                appData.api_keys.forEach((k, idx) => {
                    const opt = document.createElement('option');
                    opt.value = idx;
                    opt.textContent = `${k.label} (${maskKey(k.key)})`;
                    keySelect.appendChild(opt);
                });
            }
        }

        function onTesterProviderChange() {
            const pathStr = document.getElementById('testerProviderSelect').value;
            if (!pathStr) return;
            const target = getNestedObject(appData, pathStr.split('.'));
            if (target) {
                document.getElementById('baseUrl').value = target.url || '';
                document.getElementById('modelNames').value = (target.models || []).join(', ');
            }
        }

        function onTesterKeyChange() {
            const keyIdx = document.getElementById('testerKeySelect').value;
            if (keyIdx !== "" && appData.api_keys && appData.api_keys[keyIdx]) {
                document.getElementById('apiKey').value = appData.api_keys[keyIdx].key;
            }
        }

        function togglePasswordVisibility() {
            const keyInput = document.getElementById('apiKey');
            const icon = document.getElementById('testerEyeIcon');
            if (keyInput.type === 'password') {
                keyInput.type = 'text';
                icon.className = 'fa-solid fa-eye-slash';
            } else {
                keyInput.type = 'password';
                icon.className = 'fa-solid fa-eye';
            }
        }

        const delay = ms => new Promise(res => setTimeout(res, ms));

        async function makeSingleRequest(url, headers, body) {
            const startTime = performance.now();
            const response = await fetch(url, { method: 'POST', headers, body: JSON.stringify(body) });
            const latency = Math.round(performance.now() - startTime);
            return { response, latency };
        }

        async function testBatchModels() {
            const baseUrl = document.getElementById('baseUrl').value.trim();
            const apiKey = document.getElementById('apiKey').value.trim();
            const rawModels = document.getElementById('modelNames').value.trim();
            const isStream = document.getElementById('streamMode').checked;
            const enableReasoning = document.getElementById('enableReasoning').checked;

            if (!baseUrl || !apiKey || !rawModels) {
                showToast('لطفاً آدرس URL، کلید API و نام مدل‌ها را وارد کنید.', 'danger');
                return;
            }

            const modelsList = rawModels.split(/[\n,]+/).map(m => m.trim()).filter(m => m.length > 0);

            const table = document.getElementById('resultsTable');
            const tbody = document.getElementById('resultsBody');
            tbody.innerHTML = '';
            table.style.display = 'table';

            modelsList.forEach((model, index) => {
                tbody.innerHTML += `
                    <tr id="row-${index}">
                        <td>
                            <div class="model-cell">
                                <span>${escapeHtml(model)}</span>
                                <button class="copy-btn" onclick="copyToClipboard('${escapeHtml(model)}', 'کپی شد!')"><i class="fa-solid fa-copy"></i></button>
                            </div>
                        </td>
                        <td><span class="status-pending" id="status-${index}">در صف...</span></td>
                        <td id="mode-${index}">-</td>
                        <td id="tokens-${index}" style="font-family: 'JetBrains Mono', monospace;">-</td>
                        <td id="latency-${index}" style="font-family: 'JetBrains Mono', monospace;">-</td>
                        <td id="res-${index}" style="direction: ltr; text-align: left; font-family: 'JetBrains Mono', monospace; font-size: 12px;">-</td>
                    </tr>
                `;
            });

            const headers = { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiKey}` };

            for (let i = 0; i < modelsList.length; i++) {
                const model = modelsList[i];
                const statusTd = document.getElementById(`status-${i}`);
                const modeTd = document.getElementById(`mode-${i}`);
                const tokensTd = document.getElementById(`tokens-${i}`);
                const latencyTd = document.getElementById(`latency-${i}`);
                const resTd = document.getElementById(`res-${i}`);

                statusTd.textContent = 'در حال تست...';
                statusTd.className = 'status-pending';

                let body = { model, messages: [{ role: 'user', content: 'hi' }], max_tokens: 2, stream: isStream };

                if (enableReasoning) {
                    body.reasoning_effort = 'high';
                }

                try {
                    let resObj;
                    let connectionType = 'مستقیم';
                    let connectionClass = 'mode-direct';

                    try {
                        resObj = await makeSingleRequest(baseUrl, headers, body);
                    } catch {
                        const proxyUrl = `https://corsproxy.io/?${encodeURIComponent(baseUrl)}`;
                        resObj = await makeSingleRequest(proxyUrl, headers, body);
                        connectionType = 'پروکسی';
                        connectionClass = 'mode-proxy';
                    }

                    const { response, latency } = resObj;
                    latencyTd.textContent = `${latency} ms`;
                    modeTd.innerHTML = `<span class="badge-mode ${connectionClass}">${connectionType}</span>`;

                    if (response.ok) {
                        statusTd.textContent = '✅ موفق';
                        statusTd.className = 'status-success';
                        
                        if (isStream) {
                            tokensTd.textContent = 'نامشخص (استریم)';
                            resTd.innerHTML = `استریم OK <button class="copy-btn" onclick="copyToClipboard('OK', 'کپی شد!')"><i class="fa-solid fa-copy"></i></button>`;
                        } else {
                            const json = await response.json();
                            if (json.usage) {
                                const total = json.usage.total_tokens || ((json.usage.prompt_tokens || 0) + (json.usage.completion_tokens || 0));
                                tokensTd.textContent = `${total} (${json.usage.prompt_tokens || 0}+${json.usage.completion_tokens || 0})`;
                            } else {
                                tokensTd.textContent = 'ثبت نشده';
                            }

                            const text = json.choices?.[0]?.message?.content || 'پاسخ دریافت شد';
                            resTd.innerHTML = `${escapeHtml(text)} <button class="copy-btn" onclick="copyToClipboard('${escapeHtml(text)}', 'کپی شد!')"><i class="fa-solid fa-copy"></i></button>`;
                        }
                    } else {
                        tokensTd.textContent = '۰';
                        const errJson = await response.json().catch(() => ({}));
                        const errMsg = errJson.error?.message || 'خطا در سرویس';
                        statusTd.textContent = `❌ خطا (${response.status})`;
                        statusTd.className = 'status-error';
                        resTd.innerHTML = `${escapeHtml(errMsg)} <button class="copy-btn" onclick="copyToClipboard('${escapeHtml(errMsg)}', 'کپی شد!')"><i class="fa-solid fa-copy"></i></button>`;
                    }
                } catch (err) {
                    tokensTd.textContent = '۰';
                    statusTd.textContent = '❌ قطع ارتباط';
                    statusTd.className = 'status-error';
                    resTd.innerHTML = `${escapeHtml(err.message)} <button class="copy-btn" onclick="copyToClipboard('${escapeHtml(err.message)}', 'کپی شد!')"><i class="fa-solid fa-copy"></i></button>`;
                }

                if (i < modelsList.length - 1) {
                    await delay(1000);
                }
            }
        }

        // Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then((reg) => console.log('Service Worker فعال شد:', reg))
                    .catch((err) => console.log('خطا در فعال‌سازی Service Worker:', err));
            });
        }
    </script>
</body>
</html>
